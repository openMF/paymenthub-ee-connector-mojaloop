plugins {
    id 'java'
    id 'maven-publish'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

repositories {
    mavenCentral()
    // mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/phee-gradle-local')
    }
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/mifosx-gradle-local')
    }
}

// interop-ilp-conditions:1.7.1 is a non-relocated uber jar: besides the ILP
// classes we use, it bundles its own stale Jackson 2.13 (plus Mockito, Hamcrest,
// cglib, ASM). In the Spring Boot boot jar it sorts before jackson-annotations,
// so its old com.fasterxml.jackson.annotation.JsonFormat$Feature shadows the
// BOM-managed Jackson 2.18 and throws
// "NoSuchFieldError ... READ_DATE_TIMESTAMPS_AS_NANOSECONDS" in
// jackson-datatype-jsr310 at the quote step. Those classes are baked into the
// jar, so a Gradle `exclude` cannot remove them. We fetch the jar in isolation
// (ilpRaw) and repackage it, keeping only the com.ilp.conditions.* and
// org.interledger.* packages this connector actually references and dropping the
// bundled third-party classes. Also shrinks the artifact 3.86 MB -> ~0.35 MB.
configurations {
    ilpRaw { transitive = false }
}

dependencies {
    ilpRaw 'org.mifos:interop-ilp-conditions:1.7.1'
}

tasks.register('stripIlpConditions', Jar) {
    archiveFileName = 'interop-ilp-conditions-1.7.1-slim.jar'
    destinationDirectory = layout.buildDirectory.dir('slim-libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.ilpRaw.collect { zipTree(it) } }
    exclude 'com/fasterxml/**'
    exclude 'org/mockito/**'
    exclude 'org/hamcrest/**'
    exclude 'org/objenesis/**'
    exclude 'module-info.class'
    exclude 'META-INF/maven/com.fasterxml.jackson.core/**'
    exclude 'META-INF/services/com.fasterxml.**'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

dependencies {
    // The paymenthub-ee BOM pins Spring Boot 3.4, Camel 4, Zeebe 8, Jakarta EE 10
    // and every other shared library version (including Jackson — the old
    // resolutionStrategy forcing jackson-databind 2.4.6 was removed).
    // This is a deployable application (leaf node), so use enforcedPlatform().
    implementation enforcedPlatform('org.mifos:paymenthub-ee-bom:2.0.0-SNAPSHOT')

    implementation 'org.mifos:paymenthub-ee-core:2.0.0-SNAPSHOT'
    // Slimmed interop-ilp-conditions (see stripIlpConditions above) instead of the
    // raw 'org.mifos:interop-ilp-conditions:1.7.1' uber jar, which drags in a stale
    // bundled Jackson that breaks jsr310 deserialization at the quote step.
    implementation files(tasks.named('stripIlpConditions'))
    implementation 'org.apache.camel.springboot:camel-spring-boot-starter'
    implementation 'org.apache.camel:camel-undertow'
    implementation 'org.apache.camel.springboot:camel-jackson-starter'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.apache.camel:camel-http'
    implementation 'org.apache.camel:camel-endpointdsl'
    implementation 'org.apache.camel:camel-jetty'
    implementation 'io.camunda:zeebe-client-java'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    implementation 'org.json:json'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Bean Validation for the @Validated configuration records: nothing else
    // on the classpath provides it.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    configurations {
        // all*.exclude group: 'org.json', module: 'json'
        all*.exclude group: 'com.vaadin.external.google', module: 'android-json'
    }
}

group = 'org.mifos'
version = '2.0.0.mifos-SNAPSHOT'
description = 'paymenthub-ee-connector-mojaloop'
java.sourceCompatibility = JavaVersion.VERSION_21

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

bootRun {
    systemProperty "logging.level.root", "ERROR"
    systemProperty "spring.profiles.active", "med"

}

// Deterministic boot jar name so the Dockerfile can copy exactly one file
// (avoids the *.jar glob picking up the plain -plain.jar when `build` runs).
bootJar {
    archiveFileName = 'app.jar'
}
